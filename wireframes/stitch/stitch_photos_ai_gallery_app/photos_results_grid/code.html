<script>
  // Add subtle interactive click feedback to similarity tiles
  document.querySelectorAll('.aspect-square').forEach(card => {
    card.addEventListener('click', () => {
      const score = card.querySelector('.font-mono')?.textContent.trim();
      const notification = document.createElement('div');
      notification.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full font-label-sm text-xs shadow-lg z-50 flex items-center gap-2 animate-bounce';
      notification.innerHTML = `<span class="material-symbols-outlined text-[14px] text-primary-container">info</span> Match score: ${score}`;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 1600);
    });
  });
</script></main></body></html>
