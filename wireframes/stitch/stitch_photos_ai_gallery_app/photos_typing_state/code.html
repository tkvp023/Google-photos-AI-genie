<script>
  // Dynamic sync between slot content and simulated shell keyboard/input bar
  (function initTypingSync() {
    // Select the pill placeholder and text nodes in the app shell
    const inputContainer = document.querySelector('.bg-\\[\\#EEF0F3\\]');
    if (inputContainer) {
      // Find label & blinking cursor container
      const textSpan = inputContainer.querySelector('span:first-of-type');
      if (textSpan && textSpan.textContent.includes('Search or ask')) {
        textSpan.textContent = 'pool';
        textSpan.classList.remove('text-[#5F6368]');
        textSpan.classList.add('text-[#1F1F1F]', 'font-medium');
      }

      // Replace mic button with clear "×" button if not already swapped
      const micBtn = inputContainer.querySelector('button[aria-label="Voice search"]');
      if (micBtn) {
        micBtn.setAttribute('aria-label', 'Clear search text');
        micBtn.innerHTML = `
          <svg class="w-5 h-5 text-[#5F6368] hover:text-[#1F1F1F]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        `;
        micBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (textSpan) {
            textSpan.textContent = '';
            textSpan.classList.add('text-[#5F6368]');
            textSpan.classList.remove('text-[#1F1F1F]');
          }
        });
      }
    }

    // Update predictive / suggestion bar row in keyboard with queries related to "pool"
    const predictiveBar = document.querySelector('.bg-\\[\\#F0F2F5\\] .flex.items-center.justify-around');
    if (predictiveBar) {
      predictiveBar.innerHTML = `
        <span class="px-2 py-0.5 rounded text-[13px] text-[#5F6368] hover:bg-black/5 cursor-pointer">pools</span>
        <div class="w-[1px] h-3 bg-[#DCDCDC]"></div>
        <span class="px-2 py-0.5 rounded text-[13px] font-semibold text-[#1F1F1F] hover:bg-black/5 cursor-pointer">pool party</span>
        <div class="w-[1px] h-3 bg-[#DCDCDC]"></div>
        <span class="px-2 py-0.5 rounded text-[13px] text-[#5F6368] hover:bg-black/5 cursor-pointer">poolside</span>
      `;
    }
  })();
</script></main>
