<!-- Interactive script for dynamic chip toggling -->
<script>
    document.querySelectorAll('[role="group"] button').forEach((btn) => {
      btn.addEventListener('click', () => {
        // Toggle selection behavior
        const isSelected = btn.getAttribute('aria-pressed') === 'true';
        if (isSelected) {
          btn.setAttribute('aria-pressed', 'false');
          btn.classList.remove('bg-[#FFD3AE]', 'border-[1.5px]', 'border-[#FF9F5A]', 'font-semibold');
          btn.classList.add('bg-white', 'border', 'border-[#C7CBD1]', 'font-medium');
          const checkIcon = btn.querySelector('svg');
          if (checkIcon && !btn.querySelector('span:contains("Something else")')) {
            checkIcon.remove();
          }
        } else {
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.remove('bg-white', 'border-[#C7CBD1]', 'bg-black/5', 'font-medium');
          btn.classList.add('bg-[#FFD3AE]', 'border-[1.5px]', 'border-[#FF9F5A]', 'font-semibold');
          if (!btn.querySelector('svg')) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'w-3.5 h-3.5 text-[#1F1F1F] stroke-[2.8]');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.innerHTML = '<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>';
            btn.prepend(svg);
          }
        }
      });
    });
  </script>
