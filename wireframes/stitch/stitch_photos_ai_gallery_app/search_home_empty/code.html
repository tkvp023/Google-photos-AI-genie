<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search home (empty)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #1F1F1F;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-brand {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
    /* Touch target guarantee */
    .touch-target {
      min-width: 44px;
      min-height: 44px;
    }
  </style>
</head>
<body class="bg-white text-[#1F1F1F] min-h-screen flex justify-center selection:bg-[#FFE9D6]">

  <!-- Mobile screen container (390px fixed simulation) -->
  <div class="w-full max-w-[390px] min-h-screen bg-white flex flex-col justify-between relative shadow-2xl border-x border-[#E3E5E8]">
    
    <!-- Top section: Header & Main content -->
    <div class="flex-1 flex flex-col overflow-y-auto pb-4">
      
      <!-- Top App Bar with Back Arrow -->
      <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-3 h-14 flex items-center border-b border-[#E3E5E8]/60">
        <button class="touch-target flex items-center justify-center rounded-full hover:bg-[#F5F6F8] active:bg-[#EEF0F3] text-[#1F1F1F] transition-colors -ml-1" aria-label="Go back">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
          </svg>
        </button>
        <span class="ml-2 font-medium text-[17px] tracking-tight text-[#1F1F1F]">Search</span>
      </header>

      <main class="px-4 pt-4 flex-1">
        
        <!-- People Section -->
        <section class="mb-6">
          <div class="flex items-center justify-between mb-3 px-0.5">
            <h2 class="text-[15px] font-semibold tracking-tight text-[#1F1F1F]">People</h2>
            <button class="text-[13px] font-medium text-[#1F6FEB] hover:underline touch-target flex items-center justify-end -mr-2 pr-2">
              View all
            </button>
          </div>

          <!-- Row of 6 generic neutral avatar placeholders + 1 '…' circle -->
          <div class="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-none px-0.5">
            
            <!-- Person 1 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- Person 2 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- Person 3 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- Person 4 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- Person 5 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- Person 6 -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:border-[#1F6FEB]/40 transition-colors">
                <svg class="w-7 h-7 text-[#9AA0A6]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>

            <!-- "…" circle at the end -->
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer group">
              <div class="w-14 h-14 rounded-full bg-[#F5F6F8] border border-[#E3E5E8] flex items-center justify-center group-hover:bg-[#EEF0F3] transition-colors">
                <span class="text-[#5F6368] font-bold text-lg tracking-widest pb-1 leading-none">…</span>
              </div>
            </div>

          </div>
        </section>

        <!-- Category Section Rows: Places & Things -->
        <section class="space-y-1 mb-5">
          <!-- Places Row -->
          <div class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] active:bg-[#EEF0F3] cursor-pointer transition-colors">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-full bg-[#F5F6F8] flex items-center justify-center text-[#5F6368] border border-[#E3E5E8]">
                <!-- Location Pin icon -->
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
                </svg>
              </div>
              <span class="text-[15px] font-medium text-[#1F1F1F]">Places</span>
            </div>
            <svg class="w-5 h-5 text-[#5F6368]/60" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
            </svg>
          </div>

          <!-- Things Row -->
          <div class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] active:bg-[#EEF0F3] cursor-pointer transition-colors">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-full bg-[#F5F6F8] flex items-center justify-center text-[#5F6368] border border-[#E3E5E8]">
                <!-- Category/Shapes/Things icon -->
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
                </svg>
              </div>
              <span class="text-[15px] font-medium text-[#1F1F1F]">Things</span>
            </div>
            <svg class="w-5 h-5 text-[#5F6368]/60" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
            </svg>
          </div>
        </section>

        <!-- Divider -->
        <div class="h-[1px] bg-[#E3E5E8] my-3"></div>

        <!-- Recent Searches List -->
        <section class="mt-4">
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-[13px] font-semibold text-[#5F6368] uppercase tracking-wider">Recent searches</h2>
          </div>

          <ul class="space-y-0.5">
            <!-- Search 1: pool -->
            <li class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] cursor-pointer group">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-[15px] text-[#1F1F1F] font-normal">pool</span>
              </div>
              <button class="touch-target p-1 text-[#5F6368] hover:text-[#1F1F1F] rounded-full flex items-center justify-center opacity-70 group-hover:opacity-100" aria-label="Remove search">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </li>

            <!-- Search 2: birthday cake -->
            <li class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] cursor-pointer group">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-[15px] text-[#1F1F1F] font-normal">birthday cake</span>
              </div>
              <button class="touch-target p-1 text-[#5F6368] hover:text-[#1F1F1F] rounded-full flex items-center justify-center opacity-70 group-hover:opacity-100" aria-label="Remove search">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </li>

            <!-- Search 3: road trip -->
            <li class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] cursor-pointer group">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-[15px] text-[#1F1F1F] font-normal">road trip</span>
              </div>
              <button class="touch-target p-1 text-[#5F6368] hover:text-[#1F1F1F] rounded-full flex items-center justify-center opacity-70 group-hover:opacity-100" aria-label="Remove search">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </li>

            <!-- Search 4: beach with family -->
            <li class="touch-target flex items-center justify-between py-2 px-1 rounded-xl hover:bg-[#F5F6F8] cursor-pointer group">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[#5F6368]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-[15px] text-[#1F1F1F] font-normal">beach with family</span>
              </div>
              <button class="touch-target p-1 text-[#5F6368] hover:text-[#1F1F1F] rounded-full flex items-center justify-center opacity-70 group-hover:opacity-100" aria-label="Remove search">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </li>
          </ul>
        </section>

      </main>
    </div>

    <!-- Bottom Fixed / Keyboard Area -->
    <div class="bg-[#F5F6F8] border-t border-[#E3E5E8] flex flex-col z-40 select-none">
      
      <!-- Input Pill Bar ("Search or ask" with blinking cursor & mic icon) -->
      <div class="px-3 pt-2.5 pb-2.5 bg-white border-b border-[#E3E5E8]/80">
        <div class="w-full h-13 px-4 py-2.5 bg-[#EEF0F3] rounded-[28px] flex items-center justify-between shadow-inner focus-within:ring-2 focus-within:ring-[#1F6FEB]">
          <div class="flex items-center gap-2 overflow-hidden flex-1">
            <!-- Search icon with subtle AI sparkle accent -->
            <div class="flex items-center justify-center text-[#5F6368] flex-shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
              </svg>
            </div>
            
            <!-- Label and blinking cursor -->
            <div class="flex items-center text-[15px] text-[#5F6368] flex-1 select-none pointer-events-none">
              <span>Search or ask</span>
              <span class="inline-block w-[2px] h-[19px] bg-[#1F6FEB] ml-1 cursor-blink"></span>
            </div>
          </div>

          <!-- Mic button with minimum touch target -->
          <button class="touch-target w-10 h-10 rounded-full flex items-center justify-center text-[#5F6368] hover:text-[#1F1F1F] active:bg-[#E3E5E8] transition-colors -mr-2" aria-label="Voice search">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3v6a3 3 0 003 3z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Modern Android On-screen Keyboard Simulation -->
      <div class="bg-[#F0F2F5] px-1.5 pt-2 pb-5 flex flex-col gap-2">
        <!-- Predictive / Suggestion bar -->
        <div class="flex items-center justify-around px-2 py-1 text-[13px] text-[#5F6368] border-b border-[#E3E5E8]/80 pb-1.5">
          <span class="px-2 py-0.5 rounded hover:bg-black/5 cursor-pointer">"photos from last summer"</span>
          <div class="w-[1px] h-3 bg-[#DCDCDC]"></div>
          <span class="px-2 py-0.5 rounded font-medium text-[#1F1F1F] hover:bg-black/5 cursor-pointer">"sunset"</span>
          <div class="w-[1px] h-3 bg-[#DCDCDC]"></div>
          <span class="px-2 py-0.5 rounded hover:bg-black/5 cursor-pointer">"dogs"</span>
        </div>

        <!-- Row 1: Q - P -->
        <div class="flex justify-center gap-1.5">
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">q</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">w</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">e</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">r</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">t</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">y</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">u</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">i</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">o</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">p</button>
        </div>

        <!-- Row 2: A - L -->
        <div class="flex justify-center gap-1.5 px-2">
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">a</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">s</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">d</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">f</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">g</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">h</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">j</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">k</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">l</button>
        </div>

        <!-- Row 3: Shift, Z - M, Backspace -->
        <div class="flex justify-center gap-1.5">
          <!-- Shift key -->
          <button class="flex-1 max-w-[44px] h-10 bg-[#DCE0E5] rounded-md shadow-sm flex items-center justify-center text-[#1F1F1F] active:bg-[#C9CFD6]" aria-label="Shift">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5l-7.5 7.5h4.5V19.5h6v-7.5h4.5L12 4.5z"/>
            </svg>
          </button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">z</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">x</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">c</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">v</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">b</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">n</button>
          <button class="flex-1 max-w-[34px] h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[17px] font-normal text-[#1F1F1F] active:bg-[#D9DDE2]">m</button>
          <!-- Delete / Backspace key -->
          <button class="flex-1 max-w-[44px] h-10 bg-[#DCE0E5] rounded-md shadow-sm flex items-center justify-center text-[#1F1F1F] active:bg-[#C9CFD6]" aria-label="Backspace">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75L14.25 12m0 0l2.25 2.25M14.25 12l2.25-2.25M14.25 12L12 14.25m-2.58 4.92l-6.375-6.375a1.125 1.125 0 010-1.59L9.42 4.83c.21-.21.496-.33.795-.33H19.5a2.25 2.25 0 012.25 2.25v10.5a2.25 2.25 0 01-2.25 2.25H10.215a1.125 1.125 0 01-.795-.33z"/>
            </svg>
          </button>
        </div>

        <!-- Row 4: Symbols, Comma, Space, Period, Blue Search Return Key -->
        <div class="flex justify-center gap-1.5 items-center">
          <button class="w-12 h-10 bg-[#DCE0E5] rounded-md shadow-sm flex items-center justify-center text-[14px] font-medium text-[#1F1F1F] active:bg-[#C9CFD6]">?123</button>
          <button class="w-8 h-10 bg-[#DCE0E5] rounded-md shadow-sm flex items-center justify-center text-[16px] text-[#1F1F1F] active:bg-[#C9CFD6]">,</button>
          <!-- Spacebar -->
          <button class="flex-1 h-10 bg-white rounded-md shadow-sm flex items-center justify-center text-[13px] text-[#5F6368] active:bg-[#D9DDE2]">English</button>
          <button class="w-8 h-10 bg-[#DCE0E5] rounded-md shadow-sm flex items-center justify-center text-[16px] text-[#1F1F1F] active:bg-[#C9CFD6]">.</button>
          <!-- Search / Action Key (Primary blue #1F6FEB) -->
          <button class="w-12 h-10 bg-[#1F6FEB] hover:bg-[#1A5DC8] rounded-md shadow flex items-center justify-center text-white active:scale-95 transition-all" aria-label="Search">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
            </svg>
          </button>
        </div>

        <!-- Bottom Home Indicator / Gesture bar -->
        <div class="w-full flex justify-center pt-2">
          <div class="w-32 h-1 bg-[#1F1F1F]/30 rounded-full"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
