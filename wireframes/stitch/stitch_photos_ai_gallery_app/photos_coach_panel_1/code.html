<!-- Interactive script for dynamic chip toggling -->
<script>
    document.querySelectorAll('[role="group"] button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const isSelected = btn.getAttribute('aria-pressed') === 'true';
        if (isSelected) {
          btn.setAttribute('aria-pressed', 'false');
          btn.classList.remove('bg-primary-fixed-dim', 'text-on-surface');
          btn.classList.add('bg-surface-container-lowest');
          const checkIcon = btn.querySelector('.material-symbols-outlined');
          if (checkIcon && checkIcon.textContent.trim() === 'check') {
            checkIcon.remove();
          }
        } else {
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.remove('bg-surface-container-lowest', 'bg-surface-container');
          btn.classList.add('bg-primary-fixed-dim', 'text-on-surface');
          if (!btn.querySelector('.material-symbols-outlined')) {
            const check = document.createElement('span');
            check.className = 'material-symbols-outlined text-on-primary-container text-[18px] font-bold mr-1.5';
            check.textContent = 'check';
            btn.prepend(check);
          }
        }
      });
    });
