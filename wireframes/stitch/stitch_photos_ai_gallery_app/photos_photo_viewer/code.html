<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#f0eded", "on-secondary": "#ffffff", "on-primary-fixed": "#311300", "primary": "#944a07", "on-tertiary": "#ffffff", "primary-container": "#ff9f5a", "on-background": "#1b1b1c", "surface-bright": "#fcf9f8", "surface-tint": "#944a07", "surface-dim": "#dcd9d9", "inverse-on-surface": "#f3f0ef", "surface-container-low": "#f6f3f2", "on-tertiary-fixed-variant": "#524437", "on-secondary-fixed": "#001944", "on-surface": "#1b1b1c", "tertiary-fixed": "#f4dfcc", "on-secondary-container": "#fefcff", "secondary-fixed": "#d9e2ff", "on-secondary-fixed-variant": "#004299", "inverse-primary": "#ffb786", "secondary-container": "#1f6feb", "on-primary-fixed-variant": "#723600", "secondary": "#0056c3", "on-error-container": "#93000a", "error": "#ba1a1a", "background": "#fcf9f8", "secondary-fixed-dim": "#afc6ff", "on-surface-variant": "#544339", "on-primary-container": "#733700", "tertiary": "#6b5c4d", "inverse-surface": "#303030", "on-error": "#ffffff", "on-tertiary-fixed": "#24190e", "outline-variant": "dac2b4", "primary-fixed-dim": "#ffb786", "surface-variant": "#e5e2e1", "surface": "#fcf9f8", "tertiary-container": "#c7b3a1", "error-container": "#ffdad6", "surface-container-highest": "#e5e2e1", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#d7c3b1", "on-primary": "#ffffff", "surface-container-high": "#eae7e7", "primary-fixed": "#ffdcc6", "outl   </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs flex-1 min-w-0"><button class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface truncate">Photo Detail View</h1></div><div class="flex items-center gap-space-xs flex-shrink-0"><button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-on-surface-variant"><span class="material-symbols-outlined text-[22px]">more_vert</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 bg-surface"><div class="flex flex-col w-full relative select-none">
<!-- Immersive Canvas Container -->
<div class="relative w-full overflow-hidden bg-inverse-surface flex flex-col justify-between items-center shadow-xl" style="height: calc(100vh - 3.5rem); height: calc(100dvh - 3.5rem);">
<!-- Top Contextual Scrim Bar -->
<div class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-margin pt-space-md pb-space-xl bg-gradient-to-b from-inverse-surface/90 via-inverse-surface/40 to-transparent">
<!-- Back to Search Results Button -->
<button aria-label="Back to search results" class="w-11 h-11 flex items-center justify-center rounded-full bg-inverse-surface/60 backdrop-blur-md text-surface active:scale-95 transition-transform" id="btn-back" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- AI Match & Date Metadata Badge -->
<div class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-inverse-surface/70 backdrop-blur-md text-surface shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
<span class="font-label-sm text-label-sm tracking-wide text-inverse-on-surface">98% match</span>
<span class="w-1 h-1 rounded-full bg-surface-dim opacity-60"></span>
<span class="font-label-sm text-label-sm text-surface-dim font-normal">Jul 18, 2024</span>
</div>
</div>
<!-- Centered Image Inspection Viewport -->
<div class="relative w-full h-full flex items-center justify-center p-0 overflow-hidden" id="photo-container">
<img alt="Selected candidate photo" class="w-full h-full object-cover object-center max-w-full max-h-full transition-transform duration-300 ease-out" data-alt="Three joyful young women laughing wholeheartedly by a sunlit resort pool on a warm summer afternoon. They wear vibrant matching red swimwear with radiant sun-kissed skin, one wearing chic sunglasses. The sparkling turquoise pool water ripples behind them under a bright vacation ambiance captured on warm 35mm film." id="viewer-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtInGRPTc7P-vuW-DsR7y2W-ic-QRR5kKwwuqgMoVnzx3Kr-9QWSJVGeogyaZnjKZnQQI8En7Pir2TU0X77kRdCcVsnx2nAFYjW38o8kk4u0b5cFLJZbpl_hwP5lNRn22w0_CXx4ZoZXK3HPnUQu4TskyCzURgeYBgTkWK2sWCjtkxLrCShEtfANO8AqU86p8Ddbx8yGgVNSwVXbHnEzzadmUhAgWNgC0lOsIb-4ZrNs7dP0sRXbCJ"/>
<!-- Subtle Ambient Glow reflecting the photo's warm palette -->
<div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_80px_rgba(0,0,0,0.6)]"></div>
</div>
<!-- Bottom Scrim & Action Confirmation Bar -->
<div class="absolute bottom-0 left-0 right-0 z-30 px-margin pt-space-xl pb-safe pb-6 bg-gradient-to-t from-inverse-surface via-inverse-surface/85 to-transparent flex flex-col gap-space-sm">
<!-- Query Refinement Toast / Chip -->
<div class="self-center flex items-center gap-space-xs px-3.5 py-1 rounded-full bg-inverse-surface/80 backdrop-blur-lg mb-1 shadow-sm">
<span class="material-symbols-outlined text-[14px] text-primary-container">search</span>
<span class="font-label-sm text-label-sm text-inverse-on-surface truncate max-w-[260px]">
          “girls in red swimsuits laughing by pool”
        </span>
</div>
<!-- Action Confirmation Buttons -->
<div class="grid grid-cols-2 gap-space-sm w-full max-w-md mx-auto">
<!-- Rejection / Not It Action -->
<button class="h-12 w-full px-4 rounded-full bg-surface-container-highest/20 hover:bg-surface-container-highest/30 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs text-inverse-on-surface backdrop-blur-md" id="btn-reject" type="button">
<span class="material-symbols-outlined text-[20px] text-surface-dim">close</span>
<span class="font-label-lg text-label-lg text-surface-bright">Not it</span>
</button>
<!-- Acceptance / Found Match Action -->
<button class="h-12 w-full px-4 rounded-full bg-secondary-container hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs text-on-secondary-container shadow-lg shadow-secondary-container/25" id="btn-confirm" type="button">
<span class="material-symbols-outlined text-[20px] text-on-secondary-container font-semibold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-lg text-label-lg text-on-secondary-container">This is it</span>
</button>
</div>
</div>
<!-- Feedback Animation Overlay Layer (Hidden by default) -->
<div class="absolute inset-0 pointer-events-none z-40 flex items-center justify-center opacity-0 transition-opacity duration-300" id="feedback-overlay">
<div class="px-6 py-4 rounded-lg bg-inverse-surface/90 backdrop-blur-xl shadow-2xl flex items-center gap-3 transform scale-90 transition-transform duration-300" id="feedback-card">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-secondary-container text-on-secondary-container" id="feedback-icon-container">
<span class="material-symbols-outlined text-[24px]" id="feedback-icon">check</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-surface-bright" id="feedback-title">Memory Found</span>
<span class="font-label-sm text-label-sm text-surface-dim" id="feedback-subtitle">Pinned to your search session</span>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const btnConfirm = document.getElementById('btn-confirm');
    const btnReject = document.getElementById('btn-reject');
    const overlay = document.getElementById('feedback-overlay');
    const feedbackCard = document.getElementById('feedback-card');
    const feedbackIconContainer = document.getElementById('feedback-icon-container');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackSubtitle = document.getElementById('feedback-subtitle');
    const img = document.getElementById('viewer-img');

    function triggerFeedback(isMatch) {
      if (isMatch) {
        feedbackIconContainer.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-secondary-container text-on-secondary-container';
        feedbackIcon.textContent = 'check';
        feedbackTitle.textContent = 'Memory Saved';
        feedbackSubtitle.textContent = 'Added to curated collection';
      } else {
        feedbackIconContainer.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-surface-bright';
        feedbackIcon.textContent = 'arrow_forward';
        feedbackTitle.textContent = 'Viewing Next';
        feedbackSubtitle.textContent = 'Refining conversational context...';
      }

      overlay.classList.remove('opacity-0');
      overlay.classList.add('opacity-100');
      feedbackCard.classList.remove('scale-90');
      feedbackCard.classList.add('scale-100');

      setTimeout(() => {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        feedbackCard.classList.remove('scale-100');
        feedbackCard.classList.add('scale-90');
        if (!isMatch) {
          history.back();
        }
      }, 1200);
    }

    if (btnConfirm) {
      btnConfirm.addEventListener('click', () => triggerFeedback(true));
    }

    if (btnReject) {
      btnReject.addEventListener('click', () => triggerFeedback(false));
    }

    // Gentle double-tap or tap to zoom inspect micro-interaction
    let zoomed = false;
    if (img) {
      img.addEventListener('click', () => {
        zoomed = !zoomed;
        img.style.transform = zoomed ? 'scale(1.15)' : 'scale(1)';
      });
    }
  })();
</script></main></body></html>
